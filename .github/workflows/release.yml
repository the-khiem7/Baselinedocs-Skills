name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@v6
      - name: Stamp the version
        run: uv run scripts/stamp_version.py "${{ github.ref_name }}"
      - name: Run the suite
        run: uvx --from "pytest>=8,<10" --with pyyaml pytest tests/ -q
      - name: Commit and push to main
        run: |
          if git diff --quiet; then
            echo "main already carries ${{ github.ref_name }}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "release: ${{ github.ref_name }}"
          git push origin HEAD:main
