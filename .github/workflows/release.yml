name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Every SKILL.md carries the tag's version
        run: uv run scripts/stamp_version.py --check "${{ github.ref_name }}"
      - name: Run the suite
        run: uvx --from "pytest>=8,<10" --with pyyaml pytest tests/ -q
